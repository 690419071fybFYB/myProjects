name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master", "develop"]

jobs:
  server:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hioshop-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hioshop-server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Lint
        run: |
          HAS_ESLINT_CONFIG=false
          if [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yml ] || [ -f .eslintrc.yaml ]; then
            HAS_ESLINT_CONFIG=true
          elif [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.eslintConfig ? 0 : 1)"; then
            HAS_ESLINT_CONFIG=true
          fi

          if [ "$HAS_ESLINT_CONFIG" = "true" ]; then
            npm run lint
          else
            echo "No ESLint config found, skip lint."
          fi

      - name: Coupon smoke test
        run: npm run test:coupon

      - name: Goods import smoke test
        run: npm run test:goods-import

  admin_web:
    name: Admin Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hioshop-admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hioshop-admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --passWithNoTests

      - name: Production build
        run: npm run build:prod

  miniprogram:
    name: Miniprogram Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: JavaScript syntax checks
        working-directory: hioshop-miniprogram
        run: |
          node -c app.js
          node -c utils/request/index.js
          node -c utils/util.js
          node -c services/pay.js
          node -c services/user.js
