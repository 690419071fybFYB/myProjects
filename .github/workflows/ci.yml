name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master", "develop"]

jobs:
  server:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hioshop-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hioshop-server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Coupon smoke test (optional)
        if: ${{ vars.RUN_SERVER_SMOKE_TESTS == 'true' }}
        run: npm run test:coupon

      - name: Goods import smoke test (optional)
        if: ${{ vars.RUN_SERVER_SMOKE_TESTS == 'true' }}
        run: npm run test:goods-import

  admin_web:
    name: Admin Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hioshop-admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hioshop-admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --passWithNoTests

      - name: Production build
        run: npm run build:prod

  miniprogram:
    name: Miniprogram Lint & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hioshop-miniprogram/package-lock.json

      - name: Install dependencies
        working-directory: hioshop-miniprogram
        run: npm install

      - name: Lint
        working-directory: hioshop-miniprogram
        run: npm run lint

      - name: JavaScript syntax checks
        working-directory: hioshop-miniprogram
        run: npm run test:syntax

  pr_business_gate:
    name: PR Business Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hiolabsDB
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hioshop-server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mysql client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r testing/requirements.txt
          cd hioshop-server
          npm install

      - name: Init test database
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -proot <<'SQL'
          ALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';
          ALTER USER IF EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
          CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL
          mysql -h127.0.0.1 -uroot -proot hiolabsDB < hioshop-server/hiolabsDB.sql
          for migration in hioshop-server/sql/*.sql; do
            if [ -f "$migration" ]; then
              echo "Applying migration: $migration"
              mysql -h127.0.0.1 -uroot -proot hiolabsDB < "$migration"
            fi
          done

      - name: Start server
        run: |
          mkdir -p testing-artifacts
          cd hioshop-server
          API_JWT_SECRET=ci_api_secret_please_change \
          ADMIN_JWT_SECRET=ci_admin_secret_please_change \
          API_TOKEN_SECRET=ci_api_secret_please_change \
          ADMIN_TOKEN_SECRET=ci_admin_secret_please_change \
          MYSQL_HOST=127.0.0.1 \
          MYSQL_PORT=3306 \
          MYSQL_USER=root \
          MYSQL_PASSWORD=root \
          MYSQL_DATABASE=hiolabsDB \
          WEIXIN_PARTNER_KEY=ci_partner_key \
          WEIXIN_APPID=wx-ci \
          WEIXIN_MCH_ID=mch-ci \
          WEIXIN_NOTIFY_URL=http://127.0.0.1:8360/api/pay/notify \
          npm start > ../testing-artifacts/server-pr.log 2>&1 &
          echo $! > ../testing-artifacts/server.pid

      - name: Wait server ready
        run: |
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8360/api/index/appInfo >/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start in time"
          exit 1

      - name: Run PR gate
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_DOMAIN: ${{ secrets.COS_DOMAIN }}
          WEIXIN_PARTNER_KEY: ci_partner_key
          WEIXIN_APPID: wx-ci
          WEIXIN_MCH_ID: mch-ci
        run: |
          python3 testing/run_pr_gate.py \
            --workspace "$GITHUB_WORKSPACE" \
            --base-url "http://127.0.0.1:8360" \
            --api-jwt-secret "ci_api_secret_please_change" \
            --admin-jwt-secret "ci_admin_secret_please_change" \
            --api-user-id 1 \
            --admin-user-id 14 \
            --admin-username "qilelab.com" \
            --admin-password "qilelab.com" \
            --db-host "127.0.0.1" \
            --db-port 3306 \
            --db-user "root" \
            --db-password "root" \
            --db-name "hiolabsDB" \
            --fail-on-severity "P0"

      - name: Stop server
        if: always()
        run: |
          if [ -f testing-artifacts/server.pid ]; then
            kill "$(cat testing-artifacts/server.pid)" || true
          fi

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-business-gate-artifacts
          path: testing-artifacts
          if-no-files-found: ignore
